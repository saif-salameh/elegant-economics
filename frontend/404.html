<!DOCTYPE html>
<html lang="en" data-theme="theme-1">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found – Economics Research</title>
  <meta name="description" content="The requested page could not be found on the Economics Research site.">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .not-found { max-width: 46rem; margin: clamp(3rem, 10vh, 7rem) auto; padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid var(--border); border-radius: 1.25rem; background: var(--bg); color: var(--text); text-align: center; }
    .not-found .code { margin: 0; color: var(--accent); font-size: .9rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .not-found h1 { margin: .5rem 0; color: var(--primary); font-size: clamp(2rem, 6vw, 3.5rem); }
    .not-found p { line-height: 1.6; }
    .not-found a { display: inline-block; margin-top: .5rem; padding: .65rem 1rem; border-radius: 999px; background: var(--primary); color: var(--bg); text-decoration: none; }
  </style>
</head>
<body>
  <main class="not-found">
    <p class="code">404 · Page not found</p>
    <h1>This page isn’t here.</h1>
    <p>The link may be outdated, or the page may have moved.</p>
    <a href="index.html">Return to the home page</a>
  </main>
</body>
</html>
