<!DOCTYPE html>
<html lang="en" data-theme="theme-1">
<head>
  <meta charset="utf-8">
  <title>Financing Track – Economics Research</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/glass-cards.css">
  <script defer src="js/theme.js"></script>
</head>
<body>
  <header>
    <h1>Financing Track (Category 4)</h1>
    <nav id="main-nav">
      <a href="/">Home</a>
      <a href="/a_z_index.html">A‑Z Index</a>
      <a href="/track_economics.html">Economics</a>
      <a href="/track_financing.html">Financing</a>
      <a href="/track_global.html">Global Economy</a>
      <a href="/sources.html">Sources</a>
    </nav>
  </header>
  <main>
    <section class="grid glass-card-grid" id="concept-grid" aria-live="polite">
      <p class="loading-state">Loading concepts…</p>
    </section>
    <script type="module">
    import { buildConceptCard, fetchConcepts, showCardLoadError } from './js/components/card.js';

    const grid = document.getElementById('concept-grid');
    try {
      const all = await fetchConcepts();
      const concepts = all.filter(concept => concept.category === '4');
      grid.replaceChildren(...concepts.map(concept => buildConceptCard(concept)));
    } catch (error) {
      showCardLoadError(grid, error);
    }
    </script>
  </main>
  <footer>
    <p>&copy; 2026 Economics Research Site</p>
  </footer>
</body>
</html>
