<!DOCTYPE html>
<html lang="en" data-theme="theme-1">
<head>
  <meta charset="utf-8">
  <title>A–Z Index – Economics Research</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/glass-cards.css">
</head>
<body>
  <header>
    <h1>A–Z Index</h1>
    <nav id="main-nav">
      <a href="/">Home</a>
      <a href="/track_economics.html">Economics</a>
      <a href="/track_financing.html">Financing</a>
      <a href="/track_global.html">Global Economy</a>
      <a href="/sources.html">Sources</a>
    </nav>
  </header>
  <main>
    <section class="az-tools" aria-label="Search and jump to concepts">
      <label for="search">Search concepts</label>
      <input type="search" id="search" placeholder="Type a concept or keyword…" autocomplete="off">
      <p id="concept-count" class="concept-count" aria-live="polite">Loading concepts…</p>
      <nav id="letter-jump" class="letter-jump" aria-label="Jump to a letter"></nav>
      <div id="search-error" aria-live="polite" hidden></div>
    </section>
    <div id="letter-groups" class="letter-groups" aria-live="polite">
      <p class="loading-state">Loading concepts…</p>
    </div>
    <script type="module">
      import {
        buildConceptCard,
        fetchConcepts,
        searchConcepts,
        showCardLoadError,
      } from './js/components/card.js';

      const searchInput = document.getElementById('search');
      const count = document.getElementById('concept-count');
      const jumpBar = document.getElementById('letter-jump');
      const groupsHost = document.getElementById('letter-groups');
      const errorHost = document.getElementById('search-error');
      let allConcepts = [];
      let requestNumber = 0;
      let searchTimer;

      function displayTitle(concept) {
        return String(concept.title || '').replace(/^\d+\.\d+\.\d+\s*/, '').trim();
      }

      function render(concepts) {
        count.textContent = `${concepts.length} concepts`;
        errorHost.hidden = true;
        errorHost.replaceChildren();

        const grouped = new Map();
        for (const concept of concepts) {
          const letter = (displayTitle(concept).charAt(0) || '#').toLocaleUpperCase('en');
          if (!grouped.has(letter)) grouped.set(letter, []);
          grouped.get(letter).push(concept);
        }

        const letters = [...grouped.keys()].sort((a, b) => a.localeCompare(b, 'en'));
        const jumpLinks = letters.map(letter => {
          const link = document.createElement('a');
          link.href = `#letter-${encodeURIComponent(letter)}`;
          link.textContent = letter;
          link.setAttribute('aria-label', `Jump to ${letter}`);
          return link;
        });
        jumpBar.replaceChildren(...jumpLinks);

        if (letters.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'loading-state';
          empty.textContent = 'No concepts match your search.';
          groupsHost.replaceChildren(empty);
          return;
        }

        const sections = letters.map(letter => {
          const section = document.createElement('section');
          section.className = 'letter-group';
          section.setAttribute('aria-labelledby', `letter-heading-${letter}`);

          const heading = document.createElement('h2');
          heading.id = `letter-heading-${letter}`;
          heading.className = 'letter-heading';
          heading.textContent = letter;
          heading.tabIndex = -1;
          section.id = `letter-${letter}`;

          const cards = document.createElement('div');
          cards.className = 'glass-card-grid compact-card-grid';
          const sorted = grouped.get(letter).slice().sort((a, b) =>
            displayTitle(a).localeCompare(displayTitle(b), 'en', { sensitivity: 'base' })
          );
          cards.replaceChildren(...sorted.map(concept => buildConceptCard(concept, { compact: true })));
          section.append(heading, cards);
          return section;
        });
        groupsHost.replaceChildren(...sections);
      }

      function showError(error) {
        errorHost.hidden = false;
        showCardLoadError(errorHost, error);
      }

      try {
        allConcepts = await fetchConcepts();
        render(allConcepts);
      } catch (error) {
        count.textContent = 'Concept count unavailable';
        showError(error);
        groupsHost.replaceChildren();
      }

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();
        const thisRequest = ++requestNumber;
        clearTimeout(searchTimer);
        errorHost.hidden = true;
        errorHost.replaceChildren();

        if (!query) {
          render(allConcepts);
          return;
        }

        searchTimer = setTimeout(async () => {
          try {
            const results = await searchConcepts(query);
            if (thisRequest === requestNumber) render(results);
          } catch (error) {
            if (thisRequest === requestNumber) showError(error);
          }
        }, 140);
      });
    </script>
  </main>
  <footer>
    <p>&copy; 2026 Economics Research Site</p>
  </footer>
</body>
</html>
